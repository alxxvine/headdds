name: Deploy to GitHub Pages

on:
  push:
    # main ONLY. With the work branch in this list, the post-merge ritual —
    # squash-merge, then immediately force-push the rebased branch — raced
    # itself: the branch push landed seconds after the merge, the shared
    # `pages` concurrency group cancelled the in-flight main deploy, and the
    # branch's own deploy failed on the environment rule that only main may
    # publish. Three merged fixes in a row never reached the site.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
        with:
          # turns Pages on in GitHub Actions mode when it is disabled,
          # otherwise this step fails with "Get Pages site failed"
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
